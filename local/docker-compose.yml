# Laptop mode: Ignition 8.3 (trial) -> Apache Kafka (KRaft) -> Kafka Connect + Snowflake v4.
# Ignition authenticates to Kafka with SASL/SCRAM-SHA-512, the same mechanism it uses with
# Amazon MSK in the AWS mode. Kafka Connect uses the internal PLAINTEXT listener.
#
#   cp local/.env.example local/.env   # fill in Snowflake values
#   make local-up
name: ignition-kafka-snowflake

services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,SCRAM://:9096,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,SCRAM://kafka:9096
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,SCRAM:SASL_PLAINTEXT
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
      KAFKA_LISTENER_NAME_SCRAM_SCRAM-SHA-512_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required;
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # One-shot: create the SCRAM user Ignition logs in with, and the topic.
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      KAFKA_USERNAME: ${KAFKA_USERNAME:-ignition}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD:?set KAFKA_PASSWORD in local/.env}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-scada.demo.line1}
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -e
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:9092 --alter \
          --add-config "SCRAM-SHA-512=[password=$${KAFKA_PASSWORD}]" --entity-type users --entity-name "$${KAFKA_USERNAME}"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic "$${KAFKA_TOPIC}" --partitions 1 --replication-factor 1
    restart: "no"

  ignition:
    build: ../ignition
    image: ignition-kafka-demo:local
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    ports:
      - "8088:8088"
    environment:
      GATEWAY_ADMIN_USERNAME: admin
      GATEWAY_ADMIN_PASSWORD: ${IGNITION_ADMIN_PASSWORD:?set IGNITION_ADMIN_PASSWORD in local/.env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9096
      KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_SASL_MECHANISM: SCRAM-SHA-512
      KAFKA_USERNAME: ${KAFKA_USERNAME:-ignition}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-scada.demo.line1}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8088/StatusPing | grep -q RUNNING"]
      interval: 10s
      timeout: 5s
      retries: 30

  connect:
    build: ../connect
    image: ignition-kafka-connect:local
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/connector-plugins | grep -q SnowflakeStreamingSinkConnector"]
      interval: 10s
      timeout: 5s
      retries: 30
